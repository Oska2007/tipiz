<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — TIPIZ</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 120px;
        font-weight: 900;
        background: linear-gradient(90deg, #4f8cff, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
      }
      p {
        color: #8b96b5;
        margin: 16px 0 28px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background: linear-gradient(90deg, #4f8cff, #7c3aed);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div>
