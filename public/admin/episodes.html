<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Episodes — TIPIZ Admin</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="brand">TIPIZ</div>
        <nav>
          <a href="/admin/index.html">Dashboard</a>
          <a href="/admin/movies.html">Movies</a>
          <a href="/admin/series.html">TV Series</a>
          <a href="/admin/episodes.html" class="active">Manage Episodes</a>
          <a href="/admin/videos.html">Video Uploads</a>
          <a href="/admin/tmdb.html">TMDB Import</a>
          <a href="/admin/settings.html">Settings</a>
          <a href="/dashboard.html">← Back to site</a>
          <a href="#" id="logout">Logout</a>
        </nav>
      </aside>

      <main class="admin-main">
        <div class="admin-header">
          <h1>Manage Episodes</h1>
          <p>Assign uploaded videos to TV Series episodes</p>
        </div>

        <div class="admin-alert" id="alert"></div>

        <div class="panel">
          <div style="display: flex; gap: 16px; flex-wrap: wrap">
            <div
              class="form-row"
              style="flex: 1; min-width: 200px; margin-bottom: 0"
            >
              <label>Select TV Series</label>
              <select id="series-select">
                <option value="">-- Select a series --</option>
              </select>
            </div>
            <div
              class="form-row"
              style="flex: 1; min-width: 200px; margin-bottom: 0"
            >
              <label>Select Season</label>
              <select id="season-select" disabled>
                <option value="">-- Select a season --</option>
              </select>
            </div>
          </div>
        </div>

        <div
          id="episodes-list"
          class="panel"
          style="padding: 0; overflow: hidden"
        >
          <div style="padding: 40px; text-align: center; color: var(--muted)">
            Select a series and season to view episodes.
          </div>
        </div>
      </main>
    </div>

    <!-- Assign Video Modal -->
    <div
      id="assign-modal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        class="panel"
        style="
          max-width: 500px;
          width: 100%;
          margin: 20px;
          max-height: 90vh;
          overflow-y: auto;
        "
      >
        <h2 style="margin-bottom: 16px">Assign Video to Episode</h2>
        <p
          style="color: var(--muted); font-size: 13px; margin-bottom: 16px"
          id="modal-ep-info"
        ></p>

        <!-- Option 1: From Database -->
        <div class="form-row" style="margin-bottom: 16px">
          <label>Select from Uploaded Videos (Database)</label>
          <select id="video-select" style="width: 100%">
            <option value="">Loading videos...</option>
          </select>
        </div>

        <div
          style="
            text-align: center;
            margin: 16px 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
          "
        >
          - OR -
        </div>

        <!-- Option 2: Directly from R2 Bucket -->
        <div class="form-row" style="margin-bottom: 16px">
          <label>Select from Cloudflare R2</label>

          <!-- Search Box -->
          <input
            type="text"
            id="r2-search"
            placeholder="Search files in R2..."
            style="
              margin-bottom: 8px;
              width: 100%;
              padding: 10px;
              border-radius: 8px;
              background: #0a0f1c;
              border: 1px solid var(--border);
              color: var(--text);
            "
          />

          <!-- R2 File List Container -->
          <div
            id="r2-file-list"
            style="
              max-height: 200px;
              overflow-y: auto;
              border: 1px solid var(--border);
              border-radius: 8px;
              background: #0a0f1c;
              padding: 8px;
            "
          >
            <div style="color: var(--muted); text-align: center; padding: 10px">
              Loading R2 files...
            </div>
          </div>
          <input type="hidden" id="r2-selected-key" value="" />
        </div>

        <div style="display: flex; gap: 10px; margin-top: 24px">
          <button class="btn-admin" id="btn-do-assign">Assign Video</button>
          <button class="btn-admin secondary" id="btn-cancel-assign">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/api.js"></script>
    <script type="module">
      const { api } = window.tipiz;
      const alertBox = document.getElementById("alert");

      let allR2Files = [];
      let currentEpisodeId = null;
      let selectedR2Key = "";

      function showAlert(msg, type = "error") {
        alertBox.textContent = msg;
        alertBox.className = `admin-alert show ${type}`;
        setTimeout(() => {
          alertBox.className = "admin-alert";
        }, 5000);
      }

      function esc(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ── 1. Load Series List ──
      async function loadSeries() {
        try {
          const { results } = await api.get("/api/admin/tv?limit=100");
          const select = document.getElementById("series-select");

          if (!results || !results.length) {
            select.innerHTML = '<option value="">No series found.</option>';
            return;
          }

          select.innerHTML =
            '<option value="">-- Select a series --</option>' +
            results
              .map(
                (s) =>
                  `<option value="${s.id}">${esc(s.name)} (${s.first_air_date ? s.first_air_date.slice(0, 4) : "N/A"})</option>`,
              )
              .join("");
        } catch (err) {
          if (err.status === 401 || err.status === 403)
            window.location.href = "/admin/login.html";
          else showAlert(err.message);
        }
      }

      // ── 2. On Series Select -> Load Seasons ──
      document
        .getElementById("series-select")
        .addEventListener("change", async (e) => {
          const seriesId = e.target.value;
          const seasonSelect = document.getElementById("season-select");
          const listWrap = document.getElementById("episodes-list");

          seasonSelect.innerHTML =
            '<option value="">-- Select a season --</option>';
          listWrap.innerHTML =
            '<div style="padding:40px; text-align:center; color:var(--muted);">Select a season to view episodes.</div>';

          if (!seriesId) {
            seasonSelect.disabled = true;
            return;
          }

          try {
            const { series } = await api.get(`/api/admin/tv/${seriesId}`);
            const seasons = series.seasons || [];

            if (!seasons.length) {
              seasonSelect.innerHTML =
                '<option value="">No seasons found</option>';
              seasonSelect.disabled = true;
              return;
            }

            seasonSelect.disabled = false;
            seasonSelect.innerHTML =
              '<option value="">-- Select a season --</option>' +
              seasons
                .map(
                  (s) =>
                    `<option value="${s.season_number}">Season ${s.season_number}</option>`,
                )
                .join("");

            if (seasons.length > 0) {
              seasonSelect.value = seasons[0].season_number;
              seasonSelect.dispatchEvent(new Event("change"));
            }
          } catch (err) {
            showAlert(err.message);
          }
        });

      // ── 3. On Season Select -> Load Episodes ──
      document
        .getElementById("season-select")
        .addEventListener("change", async (e) => {
          const seriesId = document.getElementById("series-select").value;
          const seasonNum = e.target.value;
          const listWrap = document.getElementById("episodes-list");

          if (!seasonNum) {
            listWrap.innerHTML =
              '<div style="padding:40px; text-align:center; color:var(--muted);">Select a season to view episodes.</div>';
            return;
          }

          listWrap.innerHTML =
            '<div style="padding:40px; text-align:center; color:var(--muted);">Loading episodes...</div>';

          try {
            const { episodes } = await api.get(
              `/api/tv/${seriesId}/episodes?season=${seasonNum}`,
            );

            if (!episodes || !episodes.length) {
              listWrap.innerHTML = `
            <div style="padding:40px; text-align:center; color:var(--muted);">
              <p style="margin-bottom:20px;">No episodes found for this season.</p>
              <button id="btn-import-season" class="btn-admin">Download Episodes from TMDB</button>
            </div>
          `;

              document.getElementById("btn-import-season").onclick = async (
                e,
              ) => {
                const btn = e.currentTarget;
                btn.disabled = true;
                btn.textContent = "Importing...";

                try {
                  const res = await api.post(
                    `/api/tv/${seriesId}/import-season`,
                    {
                      season_number: parseInt(seasonNum, 10),
                    },
                  );
                  showAlert(
                    `Successfully imported ${res.episodes_imported} episodes!`,
                    "success",
                  );
                  document
                    .getElementById("season-select")
                    .dispatchEvent(new Event("change"));
                } catch (err) {
                  showAlert(err.message);
                  btn.disabled = false;
                  btn.textContent = "Download Episodes from TMDB";
                }
              };
              return;
            }

            listWrap.innerHTML = `
          <table style="width:100%; border-collapse:collapse;">
            <thead>
              <tr style="background:var(--bg-3); border-bottom:1px solid var(--border); text-align:left; font-size:12px; color:var(--muted);">
                <th style="padding:12px 14px;">Ep #</th>
                <th style="padding:12px 14px;">Title</th>
                <th style="padding:12px 14px;">Video Status</th>
                <th style="padding:12px 14px; text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody>
              ${episodes
                .map(
                  (ep) => `
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:12px 14px; font-weight:600;">E${ep.episode_number}</td>
                  <td style="padding:12px 14px;">
                    <div style="font-weight:600;">${esc(ep.name || "Untitled")}</div>
                    <div style="font-size:11px; color:var(--muted);">ID: ${ep.id}</div>
                  </td>
                  <td style="padding:12px 14px;">
                    ${
                      ep.video_id
                        ? '<span style="color:var(--success); font-size:12px; font-weight:600;">✓ Video Assigned</span>'
                        : '<span style="color:#fbbf24; font-size:12px; font-weight:600;">⚠ No Video</span>'
                    }
                  </td>
                  <td style="padding:12px 14px; text-align:right;">
                    <button class="btn-admin" data-ep-id="${ep.id}" data-ep-name="S${seasonNum} E${ep.episode_number}: ${esc(ep.name || "Untitled")}" style="padding:6px 12px; font-size:12px;">Assign Video</button>
                  </td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
        `;

            listWrap.querySelectorAll("[data-ep-id]").forEach((btn) => {
              btn.onclick = () =>
                openAssignModal(btn.dataset.epId, btn.dataset.epName);
            });
          } catch (err) {
            listWrap.innerHTML = `<div style="padding:40px; text-align:center; color:var(--danger);">${esc(err.message)}</div>`;
          }
        });

      // ── 4. Modal & R2 File Logic ──
      async function loadVideosForModal() {
        const dbSelect = document.getElementById("video-select");

        try {
          // 1. Load D1 Database Videos
          const dbRes = await api.get("/api/admin/videos");
          const videos = dbRes.results || [];
          dbSelect.innerHTML =
            '<option value="">-- Select DB Video --</option>' +
            videos
              .map(
                (v) =>
                  `<option value="${v.id}">${esc(v.title)} (${v.size_human})</option>`,
              )
              .join("");

          // 2. Load R2 Files (if not already loaded)
          if (allR2Files.length === 0) {
            const r2Res = await api.get("/api/admin/r2-files");
            allR2Files = r2Res.files || [];
          }
          renderR2List();
        } catch (err) {
          console.error(err);
          dbSelect.innerHTML = '<option value="">Failed to load</option>';
          document.getElementById("r2-file-list").innerHTML =
            '<div style="color:var(--danger); padding:10px;">Failed to load R2 files.</div>';
        }
      }

      function renderR2List(filter = "") {
        const listContainer = document.getElementById("r2-file-list");
        const searchLower = filter.toLowerCase();

        const filtered = allR2Files.filter((f) =>
          f.key.toLowerCase().includes(searchLower),
        );

        if (filtered.length === 0) {
          listContainer.innerHTML =
            '<div style="color:var(--muted); padding:10px; text-align:center;">No files found</div>';
          return;
        }

        // Group files by folder
        const grouped = {};
        filtered.forEach((f) => {
          const parts = f.key.split("/");
          const folder = parts.length > 1 ? parts[0] + "/" : "Root";
          if (!grouped[folder]) grouped[folder] = [];
          grouped[folder].push(f);
        });

        let html = "";
        for (const [folder, files] of Object.entries(grouped)) {
          html += `<div style="font-size:11px; font-weight:700; color:var(--muted); margin:8px 0 4px 4px; text-transform:uppercase;">📁 ${folder}</div>`;
          files.forEach((f) => {
            const isSelected = f.key === selectedR2Key;
            const bg = isSelected
              ? "background: rgba(79,140,255,0.2); border-color: var(--accent-1);"
              : "border-color: transparent;";
            const check = isSelected ? "✓ " : "📄 ";
            html += `
            <div class="r2-file-item" data-key="${f.key}" style="padding: 8px 12px; border: 1px solid; border-radius: 6px; cursor: pointer; display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; ${bg}">
              <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${check}${f.key.split("/").pop()}</span>
              <span style="color:var(--muted); font-size:11px; margin-left:8px; flex-shrink:0;">${f.size_human}</span>
            </div>
          `;
          });
        }

        listContainer.innerHTML = html;

        listContainer.querySelectorAll(".r2-file-item").forEach((item) => {
          item.onclick = () => {
            selectedR2Key = item.dataset.key;
            document.getElementById("r2-selected-key").value = selectedR2Key;
            document.getElementById("video-select").value = ""; // Clear DB dropdown selection
            renderR2List(document.getElementById("r2-search").value); // Re-render to highlight selection
          };
        });
      }

      const modal = document.getElementById("assign-modal");

      function openAssignModal(epId, epName) {
        currentEpisodeId = epId;
        selectedR2Key = "";
        document.getElementById("modal-ep-info").textContent = epName;
        document.getElementById("video-select").value = "";
        document.getElementById("r2-selected-key").value = "";
        document.getElementById("r2-search").value = "";
        modal.style.display = "flex";
        loadVideosForModal();
      }

      document.getElementById("btn-cancel-assign").onclick = () => {
        modal.style.display = "none";
        currentEpisodeId = null;
      };

      document.getElementById("video-select").onchange = () => {
        selectedR2Key = "";
        document.getElementById("r2-selected-key").value = "";
        renderR2List(document.getElementById("r2-search").value); // Clear R2 highlight
      };

      document.getElementById("r2-search").addEventListener("input", (e) => {
        renderR2List(e.target.value);
      });

      document.getElementById("btn-do-assign").onclick = async () => {
        const videoId = document.getElementById("video-select").value;
        const r2Key = document.getElementById("r2-selected-key").value;

        if (!videoId && !r2Key) return showAlert("Please select a video");

        const btn = document.getElementById("btn-do-assign");
        btn.disabled = true;
        btn.textContent = "Assigning...";

        try {
          const payload = { type: "episode", target_id: currentEpisodeId };
          if (videoId) payload.video_id = parseInt(videoId, 10);
          if (r2Key) payload.r2_key = r2Key;

          await api.post("/api/admin/assign-video", payload);
          showAlert("Video assigned successfully!", "success");
          modal.style.display = "none";

          document
            .getElementById("season-select")
            .dispatchEvent(new Event("change"));
        } catch (err) {
          showAlert(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Assign Video";
        }
      };

      document.getElementById("logout").addEventListener("click", async (e) => {
        e.preventDefault();
        await api.logout();
        window.location.href = "/admin/login.html";
      });

      // Init & Auto-select from URL
      (async () => {
        await loadSeries();
        const urlParams = new URLSearchParams(window.location.search);
        const seriesId = urlParams.get("series");
        if (seriesId) {
          const select = document.getElementById("series-select");
          select.value = seriesId;
          select.dispatchEvent(new Event("change"));
        }
      })();
    </script>
  </body>
</html>
