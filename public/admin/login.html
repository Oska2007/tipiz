<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — TIPIZ</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="logo">TIPIZ</div>
        <div class="subtitle">Admin sign in</div>

        <div class="alert" id="alert"></div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn" type="submit" id="submit-btn">
            Sign In as Admin
          </button>
        </form>
        <div class="links" id="setup-link" style="display: none">
          <a href="/admin/setup.html">First time? Create admin account →</a>
        </div>
      </div>
    </div>

    <script type="module" src="/js/api.js"></script>
    <script type="module">
      const { api } = window.tipiz;
      // admin ඉන්නවද නැද්ද බලන්න — නැත්නම් setup link එක පෙන්වන්න
      (async () => {
        try {
          const { has_admin } = await api.get("/api/setup/status");
          if (!has_admin) {
            document.getElementById("setup-link").style.display = "block";
          }
        } catch {}
      })();
      const form = document.getElementById("login-form");
      const alertBox = document.getElementById("alert");
      const btn = document.getElementById("submit-btn");

      function showAlert(msg, type = "error") {
        alertBox.textContent = msg;
        alertBox.className = `alert show ${type}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.className = "alert";
        btn.disabled = true;
        btn.textContent = "Signing in...";
        try {
          const { user } = await api.login(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value,
          );
          if (user.role !== "admin") {
            showAlert("This account is not an admin.");
            await api.logout();
            btn.disabled = false;
            btn.textContent = "Sign In as Admin";
            return;
          }
          // Admin panel is coming in step 7; for now → dashboard
          window.location.href = "/dashboard.html";
        } catch (err) {
          showAlert(err.message || "Login failed");
          btn.disabled = false;
          btn.textContent = "Sign In as Admin";
        }
      });
    </script>
  </body>
</html>
