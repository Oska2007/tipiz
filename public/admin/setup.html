<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Admin — TIPIZ</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="logo">TIPIZ</div>
        <div class="subtitle">Create the first admin account</div>

        <div class="alert" id="alert"></div>

        <div id="setup-wrap">
          <p
            style="
              font-size: 13px;
              color: var(--muted);
              margin-bottom: 20px;
              line-height: 1.6;
            "
          >
            මේ page එක පෙන්වෙන්නේ admin account එකක් තාම නැති විට පමණි. ඔබ කැමති
            email + password එකක් තෝරන්න. ඊට පස්සේ මේකෙන්ම login වෙන්න පුළුවන්.
          </p>

          <form id="setup-form">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" type="text" required value="Admin" />
            </div>
            <div class="field">
              <label for="email">Admin Email</label>
              <input
                id="email"
                type="email"
                autocomplete="email"
                required
                placeholder="admin@example.com"
              />
            </div>
            <div class="field">
              <label for="password">Password (min 8 characters)</label>
              <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
            <div class="field">
              <label for="setup_token">Setup Token</label>
              <input
                id="setup_token"
                type="password"
                required
                placeholder="From .dev.vars SETUP_TOKEN"
              />
              <div
                style="font-size: 12px; color: var(--muted); margin-top: 6px"
              >
                Local dev:
                <code style="color: #8bb4ff">dev-setup-token-12345</code>
              </div>
            </div>
            <button class="btn" type="submit" id="submit-btn">
              Create Admin Account
            </button>
          </form>
        </div>

        <div id="already-wrap" style="display: none; text-align: center">
          <p style="color: var(--muted); margin-bottom: 20px; font-size: 14px">
            Admin account එකක් දැනටමත් තියෙනවා. ඒකෙන් login වෙන්න.
          </p>
          <a
            href="/admin/login.html"
            class="btn"
            style="display: inline-block; text-decoration: none"
          >
            Go to Admin Login
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="/js/api.js"></script>
    <script type="module">
      const { api } = window.tipiz;
      const form = document.getElementById("setup-form");
      const alertBox = document.getElementById("alert");
      const btn = document.getElementById("submit-btn");
      const setupWrap = document.getElementById("setup-wrap");
      const alreadyWrap = document.getElementById("already-wrap");

      function showAlert(msg, type = "error") {
        alertBox.textContent = msg;
        alertBox.className = `alert show ${type}`;
      }

      // මුලින්ම බලනවා admin ඉන්නවද
      (async () => {
        try {
          const { has_admin } = await api.get("/api/setup/status");
          if (has_admin) {
            setupWrap.style.display = "none";
            alreadyWrap.style.display = "block";
          }
        } catch (err) {
          // ignore — assume no admin
        }
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.className = "alert";
        btn.disabled = true;
        btn.textContent = "Creating...";

        try {
          const res = await api.post("/api/setup/admin", {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            setup_token: document.getElementById("setup_token").value.trim(),
          });

          showAlert("Admin created! Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = "/admin/login.html";
          }, 1500);
        } catch (err) {
          if (err.status === 409) {
            setupWrap.style.display = "none";
            alreadyWrap.style.display = "block";
          } else {
            showAlert(err.message || "Setup failed");
            btn.disabled = false;
            btn.textContent = "Create Admin Account";
          }
        }
      });
    </script>
  </body>
</html>
