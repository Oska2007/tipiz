name = "tipiz"
main = "src/index.js"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

# ─── Frontend static files ───────────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/stream/*"]

# ─── D1 Database ─────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "tipiz-db"
database_id = "ad916917-3177-4a92-87e0-85de7f36c501"
migrations_dir = "migrations"

# ─── R2 Bucket (video + subtitles) ───────────────────
[[r2_buckets]]
binding = "R2"
bucket_name = "tipiz-media"

# ─── Rate Limiting ───────────────────────────────────
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# ─── Environment variables ───────────────────────────
[vars]
ENVIRONMENT = "production"

# Configure as secrets with `wrangler secret put <NAME>`:
# JWT_SECRET (minimum 32 characters), VPS_API_KEY, SETUP_TOKEN